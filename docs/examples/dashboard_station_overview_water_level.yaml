# Hydro Monitor -- single-station dashboard example for WATER LEVEL
# stations (English).
# German version: dashboard_station_overview_water_level.de.yaml
# Discharge: dashboard_station_overview_discharge.yaml
# Groundwater level: dashboard_station_overview_groundwater.yaml
# Spring discharge: dashboard_station_overview_spring_discharge.yaml
#
# See docs/examples/README.md before using this file: every
# "sensor.REPLACE_..." entity ID below is a placeholder and must be swapped
# for your own station's real entity IDs (Settings -> Devices & Services ->
# Hydro Monitor -> open the device -> each entity row shows its ID).
#
# This is a full Lovelace VIEW (title/icon/path + cards), not just a list
# of cards -- paste it as one item under an existing dashboard's `views:`
# list to get a new tab with a title and icon already set. If you only want
# the cards inside your current view instead, paste just the nested
# `cards:` block and set a title/icon for that view yourself (the pencil
# icon next to the view tab).
#
# If you're adding views for more than one measurement type from the same
# station (e.g. this file plus dashboard_station_overview_discharge.yaml
# for the same station), each file already has its own `path:`, so there's
# no need to change it -- Lovelace requires unique paths per dashboard, and
# the four measurement-type files here won't collide with each other.
#
# Uses `entities` cards rather than `glance` cards (other than the two
# gauges): glance cards give each entity a fixed, narrow column that
# truncates Hydro Monitor's longer, already-localized names -- entities
# cards give each row the card's full width instead.
#
# Deliberately does NOT override most entity names: Hydro Monitor's entity
# names are already translated (translations/en.json / de.json) and follow
# Home Assistant's configured language automatically. Exceptions: the
# primary value entity (referenced via the header template instead of a
# plain row, since it carries no name of its own beyond the device name)
# and the two gauge cards, whose small fixed dial area can't fit a long
# auto-generated name.
#
# Several sensors used here are disabled by default (classification
# boundaries, deciles, historical statistics, the "% of mean" comparison
# sensors). If a card shows "Entity not found", that specific entity has
# never been enabled -- enable it once on the entity's settings page
# (Settings -> Devices & Services -> Entities), and give it one update
# cycle to get a value.

title: Hydro Monitor
icon: mdi:water
path: hydro-monitor-water-level
cards:
  - type: markdown
    content: >
      ## {{ device_attr(device_id('sensor.REPLACE_VALUE'), 'name') }}

      {{ device_attr(device_id('sensor.REPLACE_VALUE'), 'model') }}

  # --- Current status -------------------------------------------------
  - type: entities
    title: Current status
    entities:
      - entity: sensor.REPLACE_VALUE
      - entity: sensor.REPLACE_LOW_WATER_CLASS
      - entity: sensor.REPLACE_OFFICIAL_DEVELOPMENT_7D
      - entity: sensor.REPLACE_TREND_STATE
      - entity: sensor.REPLACE_MEASUREMENT_AGE

  # --- History ----------------------------------------------------------
  # REPLACE_MEDIAN_W_CALENDAR_DAY is Sprint 7's historical calendar-day
  # median: the typical water level NIWIS ever recorded specifically on
  # this exact calendar day across the 1991-2020 reference period
  # (disabled by default -- see docs/examples/README.md). NIWIS has no
  # calendar-day min/max counterpart for water level (unlike discharge,
  # see dashboard_station_overview_discharge.yaml), so the min/max lines
  # here are Hydro Monitor's own rolling 30-day minimum/maximum instead --
  # a narrower comparison (the lowest/highest actually measured in the
  # last 30 days, not the historical extremes for this date). Legend
  # names are shortened here (unlike elsewhere in this file) since a
  # graph legend has far less room than an entities-card row.
  - type: history-graph
    title: Last 30 days vs. historical range
    hours_to_show: 720
    entities:
      - entity: sensor.REPLACE_VALUE
        name: Value
      - entity: sensor.REPLACE_MAXIMUM_30D
        name: 30-day max
      - entity: sensor.REPLACE_MEDIAN_W_CALENDAR_DAY
        name: Historical median (today)
      - entity: sensor.REPLACE_MINIMUM_30D
        name: 30-day min

  # --- Compared to the historical mean -----------------------------------
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.REPLACE_PERCENT_OF_MW
        name: "% of MW"
        min: 0
        max: 150
        severity:
          red: 0
          yellow: 40
          green: 70
      - type: gauge
        entity: sensor.REPLACE_PERCENT_OF_MNW
        name: "% of MNW"
        min: 0
        max: 200
        severity:
          red: 0
          yellow: 60
          green: 100

  - type: entities
    title: Historical statistics
    entities:
      - entity: sensor.REPLACE_MW
      - entity: sensor.REPLACE_MNW
      - entity: sensor.REPLACE_MINIMUM_30D
      - entity: sensor.REPLACE_MAXIMUM_30D

  # --- Waterway navigation status ------------------------------------------
  # below_glw/days_below_glw (Sprint 7 Group E, disabled by default): only
  # populate at federal waterway (Bundeswasserstraße, DEXX-landcode)
  # gauges -- e.g. the Rhine at Kaub. At a regular, non-waterway water
  # level station these will show "unavailable" once enabled, same as any
  # other type-gated Hydro Monitor sensor.
  - type: entities
    title: Waterway navigation status
    entities:
      - entity: sensor.REPLACE_BELOW_GLW
      - entity: sensor.REPLACE_DAYS_BELOW_GLW

  # --- Classification & percentile context --------------------------------
  - type: entities
    title: Classification boundaries
    entities:
      - entity: sensor.REPLACE_BOUNDARY_DYNAMIC_EXTREMELY_LOW
      - entity: sensor.REPLACE_BOUNDARY_DYNAMIC_VERY_LOW
      - entity: sensor.REPLACE_BOUNDARY_DYNAMIC_LOW
      - type: divider
      - entity: sensor.REPLACE_DECILE_P10
      - entity: sensor.REPLACE_DECILE_P50
      - entity: sensor.REPLACE_DECILE_P90

  # --- Station metadata -------------------------------------------------
  - type: entities
    title: Station
    entities:
      - entity: sensor.REPLACE_WATERBODY
      - entity: sensor.REPLACE_CATCHMENT_AREA
      - entity: sensor.REPLACE_GAUGE_ZERO_ELEVATION
      - entity: sensor.REPLACE_OPERATOR
      - entity: sensor.REPLACE_INSTITUTION
      - entity: sensor.REPLACE_LICENSE
      - entity: sensor.REPLACE_LAST_MEASUREMENT
