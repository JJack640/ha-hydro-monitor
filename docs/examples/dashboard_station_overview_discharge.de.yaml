# Hydro Monitor -- Beispiel-Dashboard für ABFLUSS-Stationen (Deutsch).
# Englische Version: dashboard_station_overview_discharge.yaml
# Wasserstand: dashboard_station_overview_water_level.de.yaml
# Grundwasserstand: dashboard_station_overview_groundwater.de.yaml
# Quellschüttung: dashboard_station_overview_spring_discharge.de.yaml
#
# Vor der Nutzung docs/examples/README.md lesen: jede "sensor.REPLACE_..."
# Entity-ID unten ist ein Platzhalter und muss durch deine echte Entity-ID
# ersetzt werden (Einstellungen -> Geräte & Dienste -> Hydro Monitor ->
# Gerät öffnen -> jede Entitätszeile zeigt ihre ID).
#
# Das ist eine vollständige Lovelace-VIEW (Titel/Icon/Pfad + Karten), keine
# reine Karten-Liste -- als ein Eintrag unter der `views:`-Liste eines
# bestehenden Dashboards einfügen, um einen neuen Tab mit bereits gesetztem
# Titel und Icon zu bekommen. Willst du nur die Karten in deiner aktuellen
# Ansicht, füge stattdessen nur den verschachtelten `cards:`-Block ein und
# setze Titel/Icon selbst (Stift-Symbol neben dem Ansichts-Tab).
#
# Legst du für eine Station Views für mehrere Messgrößentypen an (z.B.
# diese Datei plus dashboard_station_overview_water_level.de.yaml für
# dieselbe Station), hat jede Datei bereits einen eigenen `path:` -- keine
# Anpassung nötig, die vier Messgrößentyp-Dateien kollidieren nicht
# miteinander (Lovelace verlangt eindeutige Pfade pro Dashboard).
#
# Nutzt `entities`-Karten statt `glance`-Karten (außer bei den Gauges):
# Glance-Karten geben jeder Entität eine feste, schmale Spalte, die Hydro
# Monitors längere, bereits lokalisierte Namen abschneidet (z.B. "Inkofen
# Mittlerer Abfluss (MQ)") -- Entities-Karten geben jeder Zeile die volle
# Kartenbreite.
#
# Die meisten Entity-Namen werden bewusst NICHT überschrieben: Hydro
# Monitors Sensor-Namen sind bereits übersetzt (translations/en.json /
# de.json) und folgen automatisch der eingestellten Sprache. Ausnahmen: der
# primäre Wert-Sensor (stattdessen per Kopfzeilen-Vorlage eingebunden,
# trägt keinen eigenen Namen über den Gerätenamen hinaus) und die beiden
# Gauge-Karten, deren kleine, feste Anzeigefläche keinen langen
# automatisch generierten Namen fasst.
#
# Mehrere hier genutzte Sensoren sind standardmäßig deaktiviert
# (Klassifikationsgrenzen, Dezile, historische Statistiken, die
# "%-des-Mittelwerts"-Vergleichssensoren). Zeigt eine Karte "Entität nicht
# gefunden", wurde diese Entität noch nie aktiviert -- einmalig auf der
# Entitäts-Einstellungsseite aktivieren (Einstellungen -> Geräte & Dienste
# -> Entitäten) und einen Aktualisierungszyklus abwarten.

title: Hydro Monitor
icon: mdi:waves
path: hydro-monitor-abfluss
cards:
  - type: markdown
    content: >
      ## {{ device_attr(device_id('sensor.REPLACE_VALUE'), 'name') }}

      {{ device_attr(device_id('sensor.REPLACE_VALUE'), 'model') }}

  # --- Aktueller Status -------------------------------------------------
  - type: entities
    title: Aktueller Status
    entities:
      - entity: sensor.REPLACE_VALUE
      - entity: sensor.REPLACE_LOW_WATER_CLASS
      - entity: sensor.REPLACE_OFFICIAL_DEVELOPMENT_7D
      - entity: sensor.REPLACE_TREND_STATE
      - entity: sensor.REPLACE_MEASUREMENT_AGE

  # --- Verlauf --------------------------------------------------------------
  # Die drei REPLACE_..._CALENDAR_DAY-Entitäten sind Sprint 7s historische
  # Kalendertag-Bandbreite: der niedrigste, typische (Median) und höchste
  # Abfluss, den NIWIS jemals genau an diesem Kalendertag im
  # Referenzzeitraum 1991-2020 aufgezeichnet hat. Zusammen mit dem
  # aktuellen Wert geplottet, wird aus der reinen Verlaufslinie ein
  # Vergleich auf einen Blick -- ist der heutige Abfluss für diese
  # Jahreszeit niedrig, typisch oder hoch? Ihre eigenen Linien verschieben
  # sich sanft über die 30-Tage-Ansicht, weil das Kalenderdatum
  # fortschreitet, nicht weil sich der historische Datensatz selbst Tag
  # für Tag ändert. Alle drei sind standardmäßig deaktiviert -- siehe
  # docs/examples/README.md. Die Legenden-Namen sind hier (anders als
  # sonst in dieser Datei) verkürzt, da eine Graph-Legende viel weniger
  # Platz hat als eine Entities-Karten-Zeile.
  - type: history-graph
    title: Letzte 30 Tage im historischen Vergleich
    hours_to_show: 720
    entities:
      - entity: sensor.REPLACE_VALUE
        name: Wert
      - entity: sensor.REPLACE_MAX_Q_CALENDAR_DAY
        name: Historisches Maximum (heute)
      - entity: sensor.REPLACE_MEDIAN_Q_CALENDAR_DAY
        name: Historischer Median (heute)
      - entity: sensor.REPLACE_MIN_Q_CALENDAR_DAY
        name: Historisches Minimum (heute)

  # --- Vergleich mit dem historischen Mittelwert ---------------------------
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.REPLACE_PERCENT_OF_MQ
        name: "% von MQ"
        min: 0
        max: 150
        severity:
          red: 0
          yellow: 40
          green: 70
      - type: gauge
        entity: sensor.REPLACE_PERCENT_OF_MNQ
        name: "% von MNQ"
        min: 0
        max: 200
        severity:
          red: 0
          yellow: 60
          green: 100

  - type: entities
    title: Historische Statistiken
    entities:
      - entity: sensor.REPLACE_MQ
      - entity: sensor.REPLACE_MNQ
      - entity: sensor.REPLACE_NM7Q
      - entity: sensor.REPLACE_NM30Q
      - entity: sensor.REPLACE_MINIMUM_30D
      - entity: sensor.REPLACE_MAXIMUM_30D

  # --- Niedrigwasser-Bilanz -------------------------------------------------
  # SumD/SumV (Sprint 7 Gruppe D, standardmäßig deaktiviert, nur Abfluss):
  # wie viele der letzten 30 Tage als Niedrigwassertage galten und das
  # kumulierte Abflussdefizit-Volumen über dieses Fenster -- eine
  # laufende Bilanz statt eines einzelnen Referenzwerts, ergänzt also die
  # Karte "Historische Statistiken" statt sie zu duplizieren.
  - type: entities
    title: Niedrigwasser-Bilanz (letzte 30 Tage)
    entities:
      - entity: sensor.REPLACE_SUM_D
      - entity: sensor.REPLACE_SUM_V

  # --- Klassifikation & Perzentil-Kontext ----------------------------------
  - type: entities
    title: Klassifikationsgrenzen
    entities:
      - entity: sensor.REPLACE_BOUNDARY_DYNAMIC_EXTREMELY_LOW
      - entity: sensor.REPLACE_BOUNDARY_DYNAMIC_VERY_LOW
      - entity: sensor.REPLACE_BOUNDARY_DYNAMIC_LOW
      - type: divider
      - entity: sensor.REPLACE_DECILE_P10
      - entity: sensor.REPLACE_DECILE_P50
      - entity: sensor.REPLACE_DECILE_P90

  # --- Stationsmetadaten --------------------------------------------------
  - type: entities
    title: Station
    entities:
      - entity: sensor.REPLACE_WATERBODY
      - entity: sensor.REPLACE_CATCHMENT_AREA
      - entity: sensor.REPLACE_GAUGE_ZERO_ELEVATION
      - entity: sensor.REPLACE_OPERATOR
      - entity: sensor.REPLACE_INSTITUTION
      - entity: sensor.REPLACE_LICENSE
      - entity: sensor.REPLACE_LAST_MEASUREMENT
